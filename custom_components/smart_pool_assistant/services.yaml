log_maintenance:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: smart_pool_assistant
          domain: sensor
    type:
      required: true
      selector:
        select:
          options:
            - "chlor"
            - "ph_plus"
            - "ph_minus"
            - "water_exchange"
            - "filter_clean"
            - "filter_replace"
            - "set_covered"
            - "set_usage"
    amount:
      required: true
      selector:
        number:
          min: 0
          max: 5000
          step: 0.1
          mode: box
    water_exchange_percent:
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          mode: box
